name: Compile APK
on:
  workflow_dispatch: # Permet de lancer la compilation en 1 clic
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Build APK
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          echo "Erreur : Fichier gradlew introuvable à la racine."
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: MonApplicationAPK
        path: "**/build/outputs/apk/release/*.apk"
